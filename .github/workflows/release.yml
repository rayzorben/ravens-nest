name: Release AppImage

# Runs when a release tag is pushed, e.g.:
#   git tag release-1.0.0 && git push origin release-1.0.0
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "release*"
      - "v*"

permissions:
  contents: write

jobs:
  appimage:
    # Oldest supported Ubuntu LTS image → oldest glibc, so the AppImage runs on more distros
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev python3 file

      - name: Check Python services
        run: python3 -m compileall -q backend.py services packaging

      - name: Build AppImage
        run: make appimage VERSION="${GITHUB_REF_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Raven_Nest-${{ github.ref_name }}-x86_64.AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
          generate_release_notes: true
          fail_on_unmatched_files: true
